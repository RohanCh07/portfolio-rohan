<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page not found | Rohan Chauhan</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@400;500&display=swap" rel="stylesheet" />
  <script>
    try { if (localStorage.getItem("rc-mode") === "light") document.documentElement.dataset.mode = "light"; } catch (e) {}
  </script>
  <style>
    :root { --bg: #0b0a08; --ink: #f3ece0; --mute: #8f8576; --hi: #ffb224; --hi-fg: #120d02; --glow: rgba(255, 178, 36, 0.45); }
    :root[data-mode="light"] { --bg: #ebe9e4; --ink: #111; --mute: #6a665f; --hi: #ff4c24; --hi-fg: #111; --glow: rgba(255, 76, 36, 0.25); }
    * { box-sizing: border-box; margin: 0; }
    html, body { height: 100%; }
    body {
      background: var(--bg); color: var(--ink); font-family: "Space Grotesk", system-ui, sans-serif;
      display: grid; place-items: center; padding: 24px; text-align: center; overflow: hidden;
    }
    body::after {
      content: ""; position: fixed; inset: 0; pointer-events: none; opacity: 0.5;
      background: repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.18) 0 1px, transparent 1px 3px);
    }
    .code { font-family: "JetBrains Mono", monospace; color: var(--mute); font-size: 14px; }
    .code b { color: var(--hi); font-weight: 400; }
    h1 {
      font-family: "Anton", Impact, sans-serif; font-weight: 400; line-height: 0.9;
      font-size: clamp(120px, 30vw, 300px); color: var(--hi); text-shadow: 0 0 30px var(--glow);
      margin: 12px 0 8px;
    }
    p { color: var(--mute); max-width: 34ch; margin: 0 auto 28px; font-size: 18px; }
    a {
      display: inline-flex; align-items: center; gap: 10px; height: 46px; padding: 0 20px; border-radius: 6px;
      background: var(--hi); color: var(--hi-fg); text-decoration: none;
      font-family: "Anton", Impact, sans-serif; text-transform: uppercase; font-size: 17px; letter-spacing: 0.02em;
      box-shadow: 0 0 26px -8px var(--hi); transition: transform 0.3s;
    }
    a:hover { transform: translateY(-2px); }
  </style>
</head>
<body>
  <main>
    <p class="code"><b>&gt;</b> GET <span id="path">/</span> → 404 not_found</p>
    <h1>404</h1>
    <p>This page doesn't exist — or it's still training.</p>
    <a href="/">← Back to the portfolio</a>
  </main>
  <script>document.getElementById("path").textContent = location.pathname;</script>
</body>
</html>
