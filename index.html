<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rohan — Portfolio</title>
  <meta name="description" content="Interactive 3D portfolio — cozy night desk scene." />

  <!-- Fonts: Space Grotesk (headings), Inter (body) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="/style.css" />
</head>
<body>

  <!-- Three.js canvas gets appended here by experience.js -->
  <div id="canvas-container"></div>

  <!-- UI overlay layer (sits above the canvas, pointer-events off by default) -->
  <div id="ui"></div>

  <!-- Import map: three.js r160 from jsDelivr -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <!-- GSAP for camera fly-to tweens -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

  <!-- App entry point -->
  <script type="module" src="/src/main.js"></script>

</body>
</html>
